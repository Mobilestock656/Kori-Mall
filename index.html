<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORI MALL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- 🌐 Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img id="store-logo" src="https://via.placeholder.com/150" alt="Logo" class="w-10 h-10 object-contain rounded-full border">
                <span id="store-name" class="text-xl font-bold text-indigo-600">KORI MALL</span>
            </div>
            <div class="flex space-x-4">
                <button onclick="switchTab('shop')" class="font-medium hover:text-indigo-600">🏠 หน้าร้าน</button>
                <button onclick="switchTab('tracking')" class="font-medium hover:text-indigo-600">🔍 เช็คสถานะพัสดุ</button>
                <button onclick="openCart()" class="relative bg-indigo-600 text-white px-4 py-1.5 rounded-full font-medium shadow hover:bg-indigo-700">
                    🛒 ตะกร้า <span id="cart-count" class="bg-red-500 text-xs px-2 py-0.5 rounded-full ml-1">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 🌟 Banner -->
    <div id="hero-banner" class="w-full h-64 bg-cover bg-center relative flex items-center justify-center text-white" style="background-image: url('https://via.placeholder.com/1200x400');">
        <div class="absolute inset-0 bg-black opacity-40"></div>
        <div class="relative z-10 text-center px-4">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">ยินดีต้อนรับสู่ร้านค้าออนไลน์</h1>
            <p class="text-lg font-light">สินค้าคุณภาพ คัดสรรเพื่อคุณ จัดส่งไว มั่นใจได้ 100%</p>
        </div>
    </div>

    <!-- 📦 Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- TAB 1: SHOP -->
        <section id="tab-shop">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-gray-800">🛍️ สินค้าทั้งหมด</h2>
                <div id="store-contact" class="text-sm text-gray-600"></div>
            </div>

            <!-- 🏷️ Filter Category Buttons -->
            <div class="mb-6 overflow-x-auto pb-2">
                <div id="category-bar" class="flex gap-2">
                    <button onclick="filterCategory('ALL')" class="cat-btn active bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium shadow whitespace-nowrap">ทั้งหมด</button>
                    <!-- Category buttons will be rendered here -->
                </div>
            </div>
            
            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="text-center col-span-full py-12 text-gray-500">กำลังโหลดสินค้า...</div>
            </div>
        </section>

        <!-- TAB 2: TRACKING -->
        <section id="tab-tracking" class="hidden max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-center text-indigo-600">🔍 เช็คสถานะคำสั่งซื้อ</h2>
            <p class="text-gray-500 text-center mb-6 text-sm">กรอกเบอร์โทรศัพท์มือถือที่ใช้สั่งซื้อเพื่อตรวจสอบสถานะ</p>
            
            <div class="flex gap-2 mb-6">
                <input type="text" id="search-phone" placeholder="ระบุเบอร์โทรศัพท์ (เช่น 0812345678)" class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="checkOrderStatus()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700">ค้นหา</button>
            </div>

            <div id="tracking-result" class="space-y-4"></div>
        </section>

    </main>

    <!-- 🛒 Cart Modal & Checkout Modal (ใช้ส่วนเดิม) -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="w-full max-w-md bg-white h-full p-6 flex flex-col justify-between shadow-xl">
            <div>
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h2 class="text-xl font-bold">🛒 ตะกร้าสินค้า</h2>
                    <button onclick="closeCart()" class="text-gray-500 font-bold text-xl">&times;</button>
                </div>
                <div id="cart-items" class="space-y-4 max-h-[50vh] overflow-y-auto pr-2"></div>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>ยอดรวมทั้งสิ้น:</span>
                    <span id="cart-total" class="text-indigo-600">0 บาท</span>
                </div>
                <button onclick="openCheckout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 shadow">สั่งซื้อสินค้า</button>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white max-w-lg w-full p-6 rounded-xl shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold">📝 ข้อมูลจัดส่ง & ชำระเงิน</h2>
                <button onclick="closeCheckout()" class="text-gray-500 font-bold text-xl">&times;</button>
            </div>
            <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-4">
                <div><label class="block text-sm font-medium mb-1">ชื่อ-นามสกุล</label><input type="text" id="cust-name" required class="w-full border rounded-lg px-3 py-2"></div>
                <div><label class="block text-sm font-medium mb-1">เบอร์โทรศัพท์</label><input type="tel" id="cust-phone" required class="w-full border rounded-lg px-3 py-2"></div>
                <div><label class="block text-sm font-medium mb-1">ที่อยู่จัดส่ง</label><textarea id="cust-address" rows="3" required class="w-full border rounded-lg px-3 py-2"></textarea></div>
                <div class="bg-gray-50 p-3 rounded-lg border">
                    <label class="block text-sm font-medium mb-1">แนบสลิปโอนเงิน</label>
                    <input type="file" id="cust-slip" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 shadow">ยืนยันคำสั่งซื้อ</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtR6SBAr1Dp3Ll9bN22Dpu-3jYLwWTD7QQ0-LCcHFimPkolGjn2gAKz0Zu4FbZmW-R/exec"; // 👉 ใส่ Web App URL ของคุณที่นี่

        let products = [];
        let filteredProducts = [];
        let cart = [];
        let selectedCategory = 'ALL';

        window.onload = function() {
            fetchSettings();
            fetchProducts();
        };

        function switchTab(tab) {
            if (tab === 'shop') {
                document.getElementById('tab-shop').classList.remove('hidden');
                document.getElementById('tab-tracking').classList.add('hidden');
                document.getElementById('hero-banner').classList.remove('hidden');
            } else {
                document.getElementById('tab-shop').classList.add('hidden');
                document.getElementById('tab-tracking').classList.remove('hidden');
                document.getElementById('hero-banner').classList.add('hidden');
            }
        }

        async function fetchSettings() {
            try {
                let res = await fetch(`${API_URL}?action=getSettings`);
                let settings = await res.json();
                if (settings.store_name) {
                    document.getElementById('store-name').innerText = settings.store_name;
                    document.title = settings.store_name;
                }
                if (settings.logo_url) document.getElementById('store-logo').src = settings.logo_url;
                if (settings.cover_url) document.getElementById('hero-banner').style.backgroundImage = `url('${settings.cover_url}')`;
                if (settings.phone_number) {
                    document.getElementById('store-contact').innerHTML = `📞 โทร: ${settings.phone_number} | <a href="${settings.line_link}" target="_blank" class="text-green-600 font-bold">💬 แอดไลน์ร้าน</a>`;
                }
            } catch (err) {}
        }

        async function fetchProducts() {
            try {
                let res = await fetch(`${API_URL}?action=getProducts`);
                products = await res.json();
                renderCategoryBar();
                filterCategory('ALL');
            } catch (err) {
                document.getElementById('product-grid').innerHTML = `<p class="text-center col-span-full text-red-500">ไม่สามารถโหลดข้อมูลสินค้าได้</p>`;
            }
        }

        // 🏷️ ดึงหมวดหมู่ทั้งหมดแยกตามเครื่องหมายจุลภาค ,
        function renderCategoryBar() {
            let catSet = new Set();
            products.forEach(p => {
                if (p.Category) {
                    p.Category.split(',').forEach(c => catSet.add(c.trim()));
                }
            });

            let bar = document.getElementById('category-bar');
            let categories = Array.from(catSet);

            let html = `<button onclick="filterCategory('ALL')" id="cat-btn-ALL" class="cat-btn bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium shadow whitespace-nowrap">ทั้งหมด</button>`;
            
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${cat}')" id="cat-btn-${cat}" class="cat-btn bg-white text-gray-700 hover:bg-indigo-50 border px-4 py-1.5 rounded-full text-sm font-medium shadow-sm whitespace-nowrap">${cat}</button>`;
            });

            bar.innerHTML = html;
        }

        function filterCategory(category) {
            selectedCategory = category;
            
            // เปลี่ยนสีปุ่มที่ถูกเลือก
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-white text-gray-700 hover:bg-indigo-50 border px-4 py-1.5 rounded-full text-sm font-medium shadow-sm whitespace-nowrap";
            });
            let activeBtn = document.getElementById(`cat-btn-${category}`);
            if (activeBtn) activeBtn.className = "cat-btn bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium shadow whitespace-nowrap";

            if (category === 'ALL') {
                filteredProducts = products;
            } else {
                filteredProducts = products.filter(p => {
                    if (!p.Category) return false;
                    let cats = p.Category.split(',').map(c => c.trim());
                    return cats.includes(category);
                });
            }
            renderProducts();
        }

        function renderProducts() {
            let grid = document.getElementById('product-grid');
            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="text-center col-span-full text-gray-500 py-8">ไม่พบสินค้าในหมวดหมู่นี้</p>`;
                return;
            }

            grid.innerHTML = filteredProducts.map(p => {
                let isPromo = p.Is_Promo_Active;
                let priceHtml = isPromo 
                    ? `<span class="text-red-600 font-bold text-lg">฿${Number(p.Effective_Price).toLocaleString()}</span> <span class="text-gray-400 line-through text-sm">฿${Number(p.Price).toLocaleString()}</span>`
                    : `<span class="text-indigo-600 font-bold text-lg">฿${Number(p.Price).toLocaleString()}</span>`;
                
                let stockBadge = p.Stock > 0 
                    ? `<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">เหลือ ${p.Stock} ชิ้น</span>`
                    : `<span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded">สินค้าหมด</span>`;

                // 📌 Badge ปักหมุด / โปรโมชั่น
                let pinnedBadge = p.Is_Pinned ? `<span class="bg-amber-500 text-white text-xs px-2 py-1 rounded-full font-bold shadow-sm">📌 สินค้าแนะนำ</span>` : '';
                let promoBadge = isPromo ? `<span class="bg-red-500 text-white text-xs px-2 py-1 rounded-full font-bold shadow-sm">🔥 ราคาพิเศษ</span>` : '';

                // แสดง Tags หมวดหมู่ทั้งหมด
                let catTags = p.Category ? p.Category.split(',').map(c => `<span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded">${c.trim()}</span>`).join(' ') : '';

                return `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between border relative">
                        <div class="absolute top-2 left-2 z-10 flex flex-col gap-1">
                            ${pinnedBadge}
                            ${promoBadge}
                        </div>
                        <div>
                            <img src="${p.Image_URL || 'https://via.placeholder.com/300'}" alt="${p.Name}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="font-bold text-lg leading-snug">${p.Name}</h3>
                                </div>
                                <div class="flex flex-wrap gap-1 mb-2">${catTags}</div>
                                <div class="flex justify-between items-center mb-2">
                                    <div>${priceHtml}</div>
                                    ${stockBadge}
                                </div>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="addToCart('${p.Product_ID}')" ${p.Stock <= 0 ? 'disabled' : ''} class="w-full py-2 rounded-lg font-medium ${p.Stock > 0 ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
                                ${p.Stock > 0 ? '➕ เพิ่มลงตะกร้า' : 'สินค้าหมด'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Cart & Checkout Helpers
        function addToCart(productId) {
            let prod = products.find(p => p.Product_ID === productId);
            if (!prod) return;
            let existing = cart.find(item => item.product_id === productId);
            if (existing) {
                if (existing.quantity < prod.Stock) existing.quantity++;
                else alert('สินค้าในสต็อกมีจำนวนจำกัด');
            } else {
                cart.push({ product_id: prod.Product_ID, name: prod.Name, price: prod.Effective_Price, quantity: 1, image: prod.Image_URL });
            }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
            let container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-8">ตะกร้าสินค้าว่างเปล่า</p>`;
                document.getElementById('cart-total').innerText = '0 บาท';
                return;
            }
            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += item.price * item.quantity;
                return `
                    <div class="flex justify-between items-center border-b pb-3">
                        <div class="flex items-center space-x-3">
                            <img src="${item.image || 'https://via.placeholder.com/50'}" class="w-12 h-12 object-cover rounded">
                            <div>
                                <h4 class="font-medium text-sm">${item.name}</h4>
                                <p class="text-xs text-gray-500">฿${item.price} x ${item.quantity}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 font-bold hover:text-red-700">&times;</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = total.toLocaleString() + ' บาท';
        }

        function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }
        function openCart() { document.getElementById('cart-modal').classList.remove('hidden'); }
        function closeCart() { document.getElementById('cart-modal').classList.add('hidden'); }
        function openCheckout() {
            if (cart.length === 0) { alert('กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น'); return; }
            closeCart();
            document.getElementById('checkout-modal').classList.remove('hidden');
        }
        function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }

        async function submitOrder(e) {
            e.preventDefault();
            let btn = document.getElementById('submit-btn');
            btn.innerText = "กำลังบันทึกคำสั่งซื้อ...";
            btn.disabled = true;

            let fileInput = document.getElementById('cust-slip');
            let file = fileInput.files[0];

            let reader = new FileReader();
            reader.onload = async function() {
                let base64Data = reader.result;
                let totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

                let orderData = {
                    action: "createOrder",
                    phone: document.getElementById('cust-phone').value,
                    customer_name: document.getElementById('cust-name').value,
                    shipping_address: document.getElementById('cust-address').value,
                    total_amount: totalAmount,
                    items: cart.map(i => ({ product_id: i.product_id, quantity: i.quantity, price_per_unit: i.price })),
                    slip_base64: base64Data,
                    slip_mime_type: file.type
                };

                try {
                    let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(orderData) });
                    let result = await res.json();
                    if (result.status === "success") {
                        alert("สั่งซื้อสำเร็จ! รหัสออเดอร์ของคุณคือ: " + result.order_id);
                        cart = [];
                        updateCartUI();
                        closeCheckout();
                        document.getElementById('checkout-form').reset();
                    } else {
                        alert("เกิดข้อผิดพลาด: " + result.message);
                    }
                } catch (err) { alert("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้"); }
                btn.innerText = "ยืนยันคำสั่งซื้อ";
                btn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function checkOrderStatus() {
            let phone = document.getElementById('search-phone').value.trim();
            if (!phone) { alert('กรุณากรอกเบอร์โทรศัพท์'); return; }
            let resultDiv = document.getElementById('tracking-result');
            resultDiv.innerHTML = `<p class="text-center text-gray-500">กำลังค้นหาข้อมูล...</p>`;

            try {
                let res = await fetch(`${API_URL}?action=getOrderByPhone&phone=${phone}`);
                let orders = await res.json();

                if (orders.length === 0) {
                    resultDiv.innerHTML = `<p class="text-center text-red-500">ไม่พบคำสั่งซื้อที่ตรงกับเบอร์โทรนี้</p>`;
                    return;
                }

                resultDiv.innerHTML = orders.map(o => {
                    let canCancel = o.Order_Status === 'Pending';
                    return `
                        <div class="border rounded-lg p-4 bg-gray-50 shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-indigo-600">${o.Order_ID}</span>
                                <span class="px-2 py-1 text-xs rounded font-semibold ${o.Order_Status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : o.Order_Status === 'Preparing' ? 'bg-blue-100 text-blue-800' : o.Order_Status === 'Shipped' ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-800'}">
                                    สถานะ: ${o.Order_Status}
                                </span>
                            </div>
                            <p class="text-sm text-gray-600"><strong>ยอดรวม:</strong> ฿${Number(o.Total_Amount).toLocaleString()}</p>
                            <p class="text-sm text-gray-600"><strong>ที่อยู่จัดส่ง:</strong> ${o.Shipping_Address}</p>
                            ${o.Tracking_Number ? `<p class="text-sm text-indigo-600 mt-1"><strong>เลขพัสดุ (${o.Courier \vert{}\vert{} 'ขนส่ง'}):</strong> ${o.Tracking_Number}</p>` : ''}
                            
                            <div class="mt-3 pt-3 border-t flex justify-between items-center">
                                <span class="text-xs text-gray-400">สั่งซื้อเมื่อ: ${new Date(o.Created_At).toLocaleString()}</span>
                                ${canCancel ? `<button onclick="cancelOrder('${o.Order_ID}')" class="bg-red-500 text-white text-xs px-3 py-1.5 rounded hover:bg-red-600 font-medium">ยกเลิกออเดอร์</button>` : `<span class="text-xs text-gray-400 italic">ไม่สามารถยกเลิกได้ (กำลังเตรียมจัดส่ง)</span>`}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                resultDiv.innerHTML = `<p class="text-center text-red-500">เกิดข้อผิดพลาดในการดึงข้อมูล</p>`;
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm(`คุณต้องการยกเลิกคำสั่งซื้อ ${orderId} ใช่หรือไม่?`)) return;
            try {
                let res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "cancelOrder", order_id: orderId }) });
                let result = await res.json();
                if (result.status === "success") {
                    alert("ยกเลิกออเดอร์สำเร็จและคืนสต็อกเรียบร้อยแล้ว");
                    checkOrderStatus();
                } else alert(result.message);
            } catch (err) { alert("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"); }
        }
    </script>
</body>
</html>
